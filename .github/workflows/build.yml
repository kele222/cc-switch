name: Build Tauri App (Final Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8 

      # 1. 正常安装前端依赖（不再强行修改 package.json）
      - name: Install frontend dependencies
        run: pnpm install

      # 2. 安装 Rust 工具链
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 3. 【核心修复】：动态升级 Rust 后端依赖，使其与前端版本 (2.11.x 和 2.7.x) 匹配
      - name: Upgrade Rust backend dependencies to match frontend
        run: |
          # 将 tauri 核心升级到 2.11.x
          cargo add tauri@2.11 --manifest-path src-tauri/Cargo.toml
          # 将 dialog 插件升级到 2.7.x
          cargo add tauri-plugin-dialog@2.7 --manifest-path src-tauri/Cargo.toml
          # 顺便把其他可能不匹配的 Tauri 插件也同步升级到对应的 major.minor 版本
          cargo add tauri-plugin-log@2.8 --manifest-path src-tauri/Cargo.toml
          cargo add tauri-plugin-process@2.3 --manifest-path src-tauri/Cargo.toml
          cargo add tauri-plugin-updater@2.10 --manifest-path src-tauri/Cargo.toml

      # 4. 缓存 Rust 依赖（加速打包）
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 5. 构建前端
      - name: Build Frontend (Vite/React)
        run: pnpm run build || pnpm run build:web || pnpm run build:renderer

      # 6. 构建 Tauri 后端并打包
      - name: Build Tauri Backend (Rust)
        run: pnpm tauri build

      # 7. 上传产物
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-windows-exe
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/cc-switch.exe
