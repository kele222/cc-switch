name: Build Tauri App (Debug Version)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8 

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 【关键修改】：不使用 tauri-action，直接运行命令，暴露真实报错
      - name: Build Frontend (Vite/React)
        run: pnpm run build  
        # 注：如果原仓库 package.json 里的 build 命令叫别的名字（如 build:web），请自行修改

      - name: Build Tauri Backend (Rust)
        run: pnpm tauri build
        # 如果上面报错，说明是前端问题；如果这里报错，说明是 Rust 问题

      - name: Upload artifacts
        if: success() # 只有成功才上传
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-windows-exe
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/cc-switch.exe
